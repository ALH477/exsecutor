# Truthgate policy — scoped to the docs touched in this run only.
# Pre-existing content elsewhere in the tree is not gated.

[policy]
fail_on = "error"
allow_unbound_prose = true
command_mode = "allowlist"
require_lock = false
coverage = "paths"
coverage_severity = "warning"

[[docs]]
path = "examples/hydramodem/README.md"
require_bound_fences = false

[[docs]]
path = "docs/decisions/0014-hydramodem-receiver.md"
require_bound_fences = false
