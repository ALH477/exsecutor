# Copyright and licence for every file that does not carry a complete SPDX
# header of its own (REUSE Specification 3.3). `reuse lint` checks the whole
# tree against this file and LICENSES/ in CI.
#
# Headers are not added to test programs, fixtures, generated files or data,
# because their line numbers or bytes are checked; they are annotated here
# (LICENSE.EXCEPTION, "FILE HEADERS"). Precedence is "closest" unless a block
# says otherwise: a file's own header wins, and a file whose header has only a
# copyright line or only a licence tag takes the missing half from the block
# that matches it. When several blocks match one file, the LAST one applies.
version = 1

# --- The project: GPL-3.0-or-later (LICENSE, with LICENSE.EXCEPTION) ------------
# Everything not claimed below: the compiler, tests, examples, tools,
# prototypes, docs, datasets/ (generated by tools/gen-finetune.py), CI and the
# logo. The logo model (logo/Meshy_AI_*) was generated by DeMoD with Meshy AI;
# logo/exsecutor-logo.* and tests/data/signaculum_mesh.bin are rendered from it.
[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- LICENSE.GRANTS: three files also offered under LGPL-3.0-only ------------
[[annotations]]
path = [
  "tests/conformance/entry23_demodframe_golden_vectors.exsc",
  "tests/conformance/entry23/codex.exsc",
  "examples/custos/custos.exsc",
]
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "GPL-3.0-or-later OR LGPL-3.0-only"

# --- vendor/: byte-exact copies, never edited ---------------------------------
# fasmg is third-party (vendor/fasmg-x86/LICENSE.txt).
[[annotations]]
path = "vendor/fasmg-x86/**"
SPDX-FileCopyrightText = "2015-2025 Tomasz Grysztar"
SPDX-License-Identifier = "BSD-3-Clause"

# DeMoD LLC's HydraMesh wire specification and golden vectors, and HydraModem
# (Punctim) reference renders, symbol streams and verdicts: LGPL-3.0-only, as
# each directory's PROVENANCE.md records.
[[annotations]]
path = [
  "vendor/hydramesh-wire/**",
  "vendor/hydramodem-tx/**",
  "vendor/hydramodem-rx/**",
  "vendor/hydramodem-melos/**",
  "vendor/hydramodem-bicinium/**",
  "vendor/hydramodem-auditus/**",
]
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "LGPL-3.0-only"

# The impairment generators in auditus were written in this repository.
[[annotations]]
path = ["vendor/hydramodem-auditus/impair.py", "vendor/hydramodem-auditus/fluxus.py"]
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

# DeMoD LLC's StreamDB corpus: LGPL-2.1-or-later (its PROVENANCE.md explains why).
[[annotations]]
path = "vendor/streamdb-v3/**"
SPDX-FileCopyrightText = "2025-2026 DeMoD LLC"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# Each PROVENANCE.md is this project's record of a copy, written here. Some
# quote licence identifiers in prose, so in-file text is not read as a tag.
[[annotations]]
path = "vendor/*/PROVENANCE.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Unicode data -----------------------------------------------------------------
# Generated by tools/ucd-gen from the Unicode Character Database 17.0.0
# (docs/decisions/0004).
[[annotations]]
path = "compiler/shared/unicode/tables/*.bin"
SPDX-FileCopyrightText = "1991-2025 Unicode, Inc."
SPDX-License-Identifier = "Unicode-3.0"

# --- Files that quote SPDX expressions as text ------------------------------------
# A decision record that shows the header forms, and the generators that write
# headers into their output.
[[annotations]]
path = [
  "docs/decisions/0006-license-gpl3-with-exception.md",
  "tools/gen-codes.py",
  "tools/ucd-gen/gen.py",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 DeMoD LLC"
SPDX-License-Identifier = "GPL-3.0-or-later"
